```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI ATM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

.container{
    width:900px;
    min-height:550px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* LEFT PANEL */
.sidebar{
    width:280px;
    background:#1e3a8a;
    color:white;
    padding:30px;
}

.sidebar h1{
    text-align:center;
    margin-bottom:40px;
}

.sidebar button{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:white;
    color:#1e3a8a;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.sidebar button:hover{
    transform:scale(1.03);
}

.main{
    flex:1;
    padding:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    width:100%;
}

input{
    width:80%;
    padding:12px;
    margin:15px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.action-btn{
    padding:12px 25px;
    border:none;
    background:#1e3a8a;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.action-btn:hover{
    background:#2563eb;
}

.balance{
    font-size:35px;
    color:green;
    margin-top:20px;
    font-weight:bold;
}

.success{
    color:green;
    font-size:22px;
    margin-top:15px;
}

.error{
    color:red;
    font-size:20px;
    margin-top:15px;
}

#menu{
    display:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar" id="menu">
        <h1>SBI ATM</h1>

        <button onclick="showBalance()"> Check Balance</button>
        <button onclick="showCredit()"> Credit</button>
        <button onclick="showDebit()"> Debit</button>
        <button onclick="exitATM()"> Exit</button>
    </div>

    <div class="main">
        <div class="card" id="content">

            <h1>Welcome to SBI ATM</h1>
            <br>

            <h3>Enter Your PIN</h3>

            <input type="password" id="pin" placeholder="Enter PIN">
            <br>

            <button class="action-btn" onclick="login()">Login</button>

            <p id="message"></p>

        </div>
    </div>

</div>

<script>

let correctPin = 5555;
let attempts = 0;
let balance = 10000;

function login(){

    let pin = document.getElementById("pin").value;

    if(pin == correctPin){

        document.getElementById("menu").style.display = "block";

        document.getElementById("content").innerHTML = `
            <h1>Welcome Back!</h1>
            <br>
            <h2>Select an option from the left menu.</h2>
        `;
    }
    else{

        attempts++;

        if(attempts >= 3){
            document.getElementById("message").innerHTML =
            "<p class='error'>ATM Card Blocked for 24 Hours!</p>";
        }
        else{
            document.getElementById("message").innerHTML =
            `<p class='error'>Wrong PIN. Attempts Left: ${3-attempts}</p>`;
        }
    }
}

function showBalance(){

    document.getElementById("content").innerHTML = `
        <h1>Account Balance</h1>
        <div class="balance">₹${balance}</div>
    `;
}

function showCredit(){

    document.getElementById("content").innerHTML = `
        <h1>Credit Amount</h1>

        <input type="number" id="creditAmt"
        placeholder="Enter amount">

        <br>

        <button class="action-btn"
        onclick="creditMoney()">Submit</button>
    `;
}

function creditMoney(){

    let amount =
    Number(document.getElementById("creditAmt").value);

    if(amount > 0){

        balance += amount;

        document.getElementById("content").innerHTML = `
            <h1>Transaction Successful</h1>
            <p class="success">₹${amount} Credited</p>
            <div class="balance">₹${balance}</div>
        `;
    }
}

function showDebit(){

    document.getElementById("content").innerHTML = `
        <h1>Debit Amount</h1>

        <input type="number" id="debitAmt"
        placeholder="Enter amount">

        <br>

        <button class="action-btn"
        onclick="debitMoney()">Submit</button>
    `;
}

function debitMoney(){

    let amount =
    Number(document.getElementById("debitAmt").value);

    if(amount > balance){

        document.getElementById("content").innerHTML = `
            <h1>Transaction Failed</h1>
            <p class="error">Insufficient Balance</p>
            <div class="balance">₹${balance}</div>
        `;
    }
    else if(amount > 0){

        balance -= amount;

        document.getElementById("content").innerHTML = `
            <h1>Transaction Successful</h1>
            <p class="success">₹${amount} Debited</p>
            <div class="balance">₹${balance}</div>
        `;
    }
}

function exitATM(){

    document.getElementById("menu").style.display = "none";

    document.getElementById("content").innerHTML = `
        <h1>Thank You!</h1>
        <br>
        <h2>Visit Again </h2>
    `;
}

</script>

</body>
</html>
```
